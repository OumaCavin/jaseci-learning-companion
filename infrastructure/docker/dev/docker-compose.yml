version: '3.8'

services:
  # Core Database Services
  postgres:
    image: postgres:15-alpine
    container_name: jaseci-postgres
    environment:
      POSTGRES_DB: jaseci_learning
      POSTGRES_USER: jaseci_user
      POSTGRES_PASSWORD: jaseci_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d
      - ./data/postgres/migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaseci_user -d jaseci_learning"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: jaseci-redis
    command: redis-server --appendonly yes --requirepass jaseci_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./data/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  neo4j:
    image: neo4j:5.0-community
    container_name: jaseci-neo4j
    environment:
      NEO4J_AUTH: neo4j/jaseci_neo4j_password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
      - ./data/neo4j/queries:/var/lib/neo4j/import/queries
    healthcheck:
      test: ["CMD", "neo4j-admin", "graph", "info", "--database=neo4j"]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: jaseci-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./data/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Message Bus and Communication
  nats:
    image: nats:2.10-alpine
    container_name: jaseci-nats
    command: -js -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./data/nats/nats.conf:/etc/nats/nats.conf
    healthcheck:
      test: ["CMD", "nats", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Monitoring and Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: jaseci-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    container_name: jaseci-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=jaseci_grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/plugins:/var/lib/grafana/plugins
    depends_on:
      - prometheus
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaseci-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - MEMORY_MAX_TRACES=50000
    ports:
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Logging Stack
  elasticsearch-logs:
    image: elasticsearch:8.11.0
    container_name: jaseci-elasticsearch-logs
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9201:9200"
    volumes:
      - elasticsearch_logs_data:/usr/share/elasticsearch/data
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  logstash:
    image: logstash:8.11.0
    container_name: jaseci-logstash
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./monitoring/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch-logs
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  kibana:
    image: kibana:8.11.0
    container_name: jaseci-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-logs:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch-logs
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend Services
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/Dockerfile.api-gateway
      target: development
    container_name: jaseci-api-gateway
    environment:
      - DATABASE_URL=postgresql://jaseci_user:jaseci_password@postgres:5432/jaseci_learning
      - REDIS_URL=redis://:jaseci_redis_password@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:4222
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PROMETHEUS_PORT=9090
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./services/core/api_gateway:/app
      - ./data/api_gateway/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Multi-Agent System
  orchestrator:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/Dockerfile.orchestrator
      target: development
    container_name: jaseci-orchestrator
    environment:
      - DATABASE_URL=postgresql://jaseci_user:jaseci_password@postgres:5432/jaseci_learning
      - REDIS_URL=redis://:jaseci_redis_password@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:4222
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - PROMETHEUS_PORT=9090
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - MAX_CONCURRENT_AGENTS=20
      - AGENT_HEARTBEAT_INTERVAL=30
      - ORCHESTRATION_TIMEOUT=300
      - ENVIRONMENT=development
      - DEBUG=true
    ports:
      - "8001:8001"
    volumes:
      - ./services/orchestrator:/app
      - ./data/orchestrator/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Individual Agent Services
  learning-progress-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/Dockerfile.learning-progress-agent
      target: development
    container_name: jaseci-learning-progress-agent
    environment:
      - DATABASE_URL=postgresql://jaseci_user:jaseci_password@postgres:5432/jaseci_learning
      - REDIS_URL=redis://:jaseci_redis_password@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:4222
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - AGENT_ID=learning_progress_001
      - AGENT_TYPE=learning_progress
      - MAX_CONCURRENT_TASKS=10
      - ENVIRONMENT=development
    volumes:
      - ./services/orchestrator/agents/learning_progress:/app
      - ./data/agents/logs:/app/logs
    depends_on:
      - orchestrator
      - postgres
      - neo4j
      - redis
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  quiz-generator-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/Dockerfile.quiz-generator-agent
      target: development
    container_name: jaseci-quiz-generator-agent
    environment:
      - DATABASE_URL=postgresql://jaseci_user:jaseci_password@postgres:5432/jaseci_learning
      - REDIS_URL=redis://:jaseci_redis_password@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:4222
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - AGENT_ID=quiz_generator_001
      - AGENT_TYPE=quiz_generator
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MAX_CONCURRENT_TASKS=5
      - ENVIRONMENT=development
    volumes:
      - ./services/orchestrator/agents/quiz_generator:/app
      - ./data/agents/logs:/app/logs
    depends_on:
      - orchestrator
      - postgres
      - neo4j
      - redis
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  code-analyzer-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/Dockerfile.code-analyzer-agent
      target: development
    container_name: jaseci-code-analyzer-agent
    environment:
      - DATABASE_URL=postgresql://jaseci_user:jaseci_password@postgres:5432/jaseci_learning
      - REDIS_URL=redis://:jaseci_redis_password@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:4222
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - AGENT_ID=code_analyzer_001
      - AGENT_TYPE=code_analyzer
      - MAX_CONCURRENT_TASKS=8
      - ENVIRONMENT=development
    volumes:
      - ./services/orchestrator/agents/code_analyzer:/app
      - ./data/agents/logs:/app/logs
    depends_on:
      - orchestrator
      - postgres
      - neo4j
      - redis
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  quality-assessor-agent:
    build:
      context: .
      dockerfile: infrastructure/docker/dev/Dockerfile.quality-assessor-agent
      target: development
    container_name: jaseci-quality-assessor-agent
    environment:
      - DATABASE_URL=postgresql://jaseci_user:jaseci_password@postgres:5432/jaseci_learning
      - REDIS_URL=redis://:jaseci_redis_password@redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NATS_URL=nats://nats:4222
      - ORCHESTRATOR_URL=http://orchestrator:8001
      - AGENT_ID=quality_assessor_001
      - AGENT_TYPE=quality_assessor
      - MAX_CONCURRENT_TASKS=3
      - ENVIRONMENT=development
    volumes:
      - ./services/orchestrator/agents/quality_assessor:/app
      - ./data/agents/logs:/app/logs
    depends_on:
      - orchestrator
      - postgres
      - neo4j
      - redis
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Frontend
  frontend:
    build:
      context: ./frontend/web-dashboard
      dockerfile: ../../../infrastructure/docker/dev/Dockerfile.frontend
      target: development
    container_name: jaseci-frontend
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_PROMETHEUS_URL=http://localhost:9090
      - NEXT_PUBLIC_GRAFANA_URL=http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/web-dashboard:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway
    networks:
      - jaseci-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Load Balancer and Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: jaseci-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/sites:/etc/nginx/conf.d
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl
      - ./data/nginx/logs:/var/log/nginx
    depends_on:
      - api-gateway
      - frontend
      - orchestrator
    networks:
      - jaseci-network
    restart: unless-stopped

networks:
  jaseci-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local
  neo4j_import:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_logs_data:
    driver: local
  nats_data:
    driver: local
